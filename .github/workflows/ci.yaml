name: Test and container checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py http://localhost:8080
      - if: always()
        run: docker compose logs && docker compose down
