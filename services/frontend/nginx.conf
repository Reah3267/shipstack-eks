server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/tasks { proxy_pass http://tasks:8000/tasks; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location = /api/summary { proxy_pass http://summary:8001/summary; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
    location / { try_files $uri $uri/ =404; }
}
